---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kitsunelinux
description: immuatuble linux distro based on Universal Blue & bootc.

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44 

# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/ into your image's root folder.

  - type: dnf
    repos:
      copr:
        - ashbuk/Hyprland-Fedora
    install:
      packages:
      # terminal apps
        - foot
        - micro
        - fish
        - fastfetch
        - git
      # desktop exp
        - hyprland
        - brightnessctl

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished 
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: 
          - it.mijorus.gearlever
      - scope: user # Also add Flathub user repo, but no user packages

  - type: os-release
    properties:
      ID: kitsunelinux
      ID_Like: fedora
      NAME: Kitsune Linux
      PRETTY_NAME: Kitsune Linux (Fedora Based)

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
